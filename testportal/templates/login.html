<html class="light" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        
        .academic-bg {
            background-color: #f7f9fb;
            background-image: radial-gradient(#d0e1fb 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }

        .login-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 20px 25px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }

        .role-option {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .role-radio:checked + .role-option {
            border-color: #00288e;
            background-color: #f2f4f6;
            box-shadow: 0 0 0 1px #00288e;
        }

        .role-radio:checked + .role-option .role-icon {
            color: #00288e;
            font-variation-settings: 'FILL' 1;
        }

        /* Hide Scrollbar for cleaner look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="academic-bg min-h-screen flex items-center justify-center font-body-md text-on-surface p-margin-mobile md:p-margin-desktop">
<!-- Background Decorative Elements -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute top-1/2 -right-24 w-64 h-64 bg-tertiary-container/5 rounded-full blur-3xl"></div>
</div>
<!-- Main Content Wrapper -->
<main class="relative z-10 w-full max-w-[480px]">
<!-- Brand Identity Section -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-xl shadow-lg mb-6">
<span class="material-symbols-outlined text-on-primary text-[32px]">school</span>
</div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tight">
                Online Exam Portal
            </h1>
<p class="font-title-sm text-title-sm text-secondary mt-2 opacity-80">
                Academic Precision &amp; Institutional Integrity
            </p>
</div>
<!-- Login Card -->
<div class="login-card bg-surface-container-lowest rounded-xl p-8 md:p-10">
<form class="space-y-6" method="post">
{% csrf_token %}
<!-- Role Selection -->
<div class="space-y-3">
<label class="font-label-caps text-label-caps text-outline uppercase">Access Level</label>
<div class="grid grid-cols-2 gap-4">
<!-- Student Role -->
<label class="relative cursor-pointer">
<input checked="" class="role-radio sr-only" name="role" type="radio" value="student"/>
<div class="role-option flex flex-col items-center justify-center p-4 rounded-lg border border-outline-variant hover:border-primary/50 bg-white">
<span class="material-symbols-outlined role-icon text-outline mb-2 text-2xl">person</span>
<span class="font-title-sm text-body-md font-semibold">Student</span>
</div>
</label>
<!-- Admin Role -->
<label class="relative cursor-pointer">
<input class="role-radio sr-only" name="role" type="radio" value="admin"/>
<div class="role-option flex flex-col items-center justify-center p-4 rounded-lg border border-outline-variant hover:border-primary/50 bg-white">
<span class="material-symbols-outlined role-icon text-outline mb-2 text-2xl">shield_person</span>
<span class="font-title-sm text-body-md font-semibold">Admin</span>
</div>
</label>
</div>
</div>
<!-- Email/ID Input -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-outline uppercase" for="id">Institutional ID / Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-4 focus:ring-primary/5 outline-none transition-all font-body-md" name="email" placeholder="e.g. john.doe@university.edu" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-outline uppercase" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline font-semibold" href="#">Forgot Access?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-4 focus:ring-primary/5 outline-none transition-all font-body-md" name ="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility</span>
</button>
</div>
</div>

<!-- Submit Button -->
 <input class="w-full bg-primary hover:bg-primary-container text-white py-4 rounded-lg font-title-sm text-title-sm shadow-md hover:shadow-xl transform active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2" formaction="{% url 'login' %}" type="submit" value="Sign In to Portal">
<!-- <button class="w-full bg-primary hover:bg-primary-container text-white py-4 rounded-lg font-title-sm text-title-sm shadow-md hover:shadow-xl transform active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2" formaction="{% url 'login' %}" type="submit">
<span>Sign In to Portal</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button> -->
</form>
{{ error_message }}
<!-- Footer Info -->
<div class="mt-8 pt-8 border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-outline">
                    New to the institution? <a class="text-primary font-bold hover:underline" href="#">Contact Admissions</a>
</p>
</div>
</div>

<!-- Legal/Trust Footer -->
<footer class="mt-8 flex flex-col md:flex-row items-center justify-between gap-4 text-outline font-label-caps text-label-caps px-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span>ISO 27001 Certified Environment</span>
</div>
<div class="flex gap-6">
<a class="hover:text-primary" href="#">System Status</a>
<a class="hover:text-primary" href="#">Privacy Policy</a>
</div>
</footer>
</main>
<!-- UI Micro-interactions -->
<script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('visibilityIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        //             alert('Redirecting to dashboard...');
        //             btn.disabled = false;
        //             btn.innerHTML = originalContent;
        //             btn.classList.add('bg-primary');
        //             btn.classList.remove('bg-green-600');
        //         }, 1000);
        //     }, 1500);
        // });

        // Dynamic Role Switching interactions
        const roleRadios = document.querySelectorAll('.role-radio');
        roleRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Add a subtle bounce effect on selection
                const target = e.target.nextElementSibling;
                target.classList.add('scale-105');
                setTimeout(() => target.classList.remove('scale-105'), 200);
            });
        });
    </script>
</body></html>
